# ゲームのコードや素材が変わったら、ブラウザ版の web/starx.pyxapp を作り直してコミットする
name: Build pyxapp

on:
  push:
    branches: [main]
    paths:
      - "main.py"
      - "game/**"
      - "assets/**"
      - "tools/build_pyxapp.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-pyxapp
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyxel
      - run: python tools/build_pyxapp.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/starx.pyxapp
          if git diff --cached --quiet; then
            echo "no change"
            exit 0
          fi
          git commit -m "Rebuild web/starx.pyxapp for ${GITHUB_SHA::7}"
          git push
